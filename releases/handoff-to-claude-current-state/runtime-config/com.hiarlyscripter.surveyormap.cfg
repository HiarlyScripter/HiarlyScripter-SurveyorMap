## Internal migration marker for SurveyorMap layout defaults.
# Setting type: Int32
# Default value: 0
LayoutDefaultsVersion = 6

[Performance]

## Seconds between visual HUD updates.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0,02 to 0,5
UpdateRate = 0.05

## Maximum native map RenderTexture captures per second.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 1 to 30
CaptureFPS = 5

## Capture the native map only when the HUD gate is open.
# Setting type: Boolean
# Default value: true
CaptureOnlyWhenVisible = true

## Pause native map capture while the minimap is toggled off.
# Setting type: Boolean
# Default value: true
PauseCaptureWhenToggleOff = true

## SurveyorMap capture RenderTexture size.
# Setting type: Int32
# Default value: 256
# Acceptable values: 128, 256, 512
RenderTextureSize = 256

## Log lightweight SurveyorMap runtime profiling metrics.
# Setting type: Boolean
# Default value: false
EnableProfiling = false

## Seconds between profiling summaries.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 2 to 30
ProfilingLogInterval = 5

## Warn and auto-throttle when map camera rendering exceeds this many milliseconds on average.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 1 to 25
