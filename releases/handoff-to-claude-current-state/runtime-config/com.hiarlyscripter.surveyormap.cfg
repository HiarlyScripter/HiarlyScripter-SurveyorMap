[Diagnostics]

## Log verbosity.
# Setting type: LogLevelSetting
# Default value: Info
# Acceptable values: Error, Warning, Info, Debug
LogLevel = Info

## Log detailed enemy scan telemetry: name, type, positions, distance, alive/active/renderer state, and accept/reject reason.
# Setting type: Boolean
# Default value: false
DebugEnemyTelemetry = false

## Show a small debug status line under the minimap.
# Setting type: Boolean
# Default value: false
EnableDebugOverlay = false

[Enemies]

## Show enemy markers on the minimap overlay.
# Setting type: Boolean
# Default value: true
ShowEnemies = true

## Enemy scan mode.
# Setting type: EnemyDetectionMode
# Default value: NearbyOnly
# Acceptable values: Off, NearbyOnly, All
EnemyDetectionMode = NearbyOnly

## Radius for NearbyOnly enemy detection.
# Setting type: Single
# Default value: 25
# Acceptable value range: From 5 to 100
EnemyDetectionRadius = 25

## Seconds between enemy scans.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0,25 to 5
EnemyUpdateInterval = 0.5

## Visual style for enemy markers.
# Setting type: EnemyMarkerStyle
# Default value: WarningOnly
# Acceptable values: WarningOnly, Dot, Pulse
EnemyMarkerStyle = WarningOnly

## Maximum enemy markers shown at once.
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 0 to 100
MaxEnemyMarkers = 20

[General]

## Enable the SurveyorMap HUD.
# Setting type: Boolean
# Default value: true
EnableMinimap = true

## Keep the minimap visible while spectating.
# Setting type: Boolean
# Default value: true
EnableSpectatorMode = true

## Disable only failing features instead of throwing repeated errors.
# Setting type: Boolean
# Default value: true
SafeMode = false

[Layout]

## Screen corner for the minimap.
# Setting type: PositionPreset
# Default value: BottomLeft
# Acceptable values: BottomLeft, BottomRight, TopLeft, TopRight, Custom
PositionPreset = BottomLeft

## Overall minimap scale.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,5 to 2
Scale = 1

## Overall HUD opacity.
# Setting type: Single
# Default value: 0.85
# Acceptable value range: From 0,1 to 1
Opacity = 0.85

## Show the minimap border.
# Setting type: Boolean
# Default value: true
ShowBorder = true

## Border opacity.
# Setting type: Single
# Default value: 0.9
# Acceptable value range: From 0 to 1
BorderOpacity = 0.85

## Border thickness in pixels.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 1 to 8
BorderThickness = 3

## Background opacity behind the native map texture.
# Setting type: Single
# Default value: 0.55
# Acceptable value range: From 0 to 1
BackgroundOpacity = 0.55

## Opacity of the captured native map texture.
# Setting type: Single
# Default value: 0.78
# Acceptable value range: From 0,1 to 1
MapOpacity = 0.78

## Use a darker soft overlay and cleaner frame styling.
# Setting type: Boolean
# Default value: true
SoftFrame = true

## Use a square minimap. If false, use a wider panel.
# Setting type: Boolean
# Default value: true
UseSquareMap = true

## Custom minimap X position in screen pixels from the bottom-left anchor.
# Setting type: Single
# Default value: 24
# Acceptable value range: From 0 to 4096
PosX = 24

## Custom minimap Y position in screen pixels from the bottom-left anchor.
# Setting type: Single
# Default value: 120
# Acceptable value range: From 0 to 4096
PosY = 120

## Minimap width before scale.
# Setting type: Single
# Default value: 260
# Acceptable value range: From 160 to 640
Width = 260

## Minimap height before scale.
# Setting type: Single
# Default value: 260
# Acceptable value range: From 140 to 640
Height = 260

[Map]

## World-to-minimap zoom.
# Setting type: Single
# Default value: 2.25
# Acceptable value range: From 0,5 to 8
Zoom = 2.999999

## Rotate minimap content around the local player's yaw.
# Setting type: Boolean
# Default value: false
RotateWithPlayer = false

## Keep the local player marker centered and move the map around it.
# Setting type: Boolean
# Default value: true
CenterOnPlayer = true

## Reserved for smoother room rendering in a future visual pass.
