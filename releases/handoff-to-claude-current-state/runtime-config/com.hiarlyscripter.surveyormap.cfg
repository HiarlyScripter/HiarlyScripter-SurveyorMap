[Markers]

## Show the local player marker.
# Setting type: Boolean
# Default value: true
ShowSelfMarker = true

## Show teammate markers.
# Setting type: Boolean
# Default value: true
ShowTeammates = true

## Show teammate names next to markers.
# Setting type: Boolean
# Default value: false
EnableNames = false

## Clamp off-map markers to the minimap bounds.
# Setting type: Boolean
# Default value: true
ClampMarkersToBounds = true

## Marker size multiplier.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,5 to 2,5
MarkerScale = 1

